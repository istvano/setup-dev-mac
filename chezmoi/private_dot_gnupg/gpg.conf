# GnuPG configuration.
#
# The private_ prefix on the directory makes chezmoi apply 0700; gpg refuses to
# run when ~/.gnupg is group- or world-readable.

# Always show the long key ID and the full fingerprint. Short IDs are trivially
# collidable and must never be used to identify a key.
keyid-format 0xlong
with-fingerprint
with-subkey-fingerprint

# Do not leak the local GnuPG version in signatures and encrypted output.
no-emit-version
no-comments

# Show which UID and policy a signature actually carries rather than a summary.
verify-options show-uid-validity
list-options show-uid-validity

# Refuse the weak digests some old clients still offer.
personal-cipher-preferences AES256 AES192 AES
personal-digest-preferences SHA512 SHA384 SHA256
personal-compress-preferences ZLIB BZIP2 ZIP Uncompressed
default-preference-list SHA512 SHA384 SHA256 AES256 AES192 AES ZLIB BZIP2 ZIP Uncompressed
cert-digest-algo SHA512
s2k-digest-algo SHA512
s2k-cipher-algo AES256
weak-digest SHA1

# No automatic key fetching. Retrieving a key is a trust decision and is done
# deliberately, not as a side effect of verifying a signature.
keyserver-options no-auto-key-retrieve
no-auto-key-locate

charset utf-8
