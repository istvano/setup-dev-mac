# tmux configuration.

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc,ghostty:Tc"

set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -sg escape-time 10
set -g focus-events on

# Splits open in the current pane's directory.
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind r source-file ~/.tmux.conf \; display "Reloaded ~/.tmux.conf"

# Vi-style copy mode; copied text goes to the macOS clipboard.
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"

set -g status-position top
set -g status-style "bg=default"
set -g status-left "#[bold]#S "
set -g status-right "#{?client_prefix,PREFIX ,}%Y-%m-%d %H:%M "
set -g status-right-length 40
