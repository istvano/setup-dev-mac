# Keep shell history local unless sync is explicitly configured by the user.
auto_sync = false
update_check = false

# Insert selected history for review instead of executing it immediately.
# This deliberately diverges from upstream, where enter_accept defaults to true.
# Do not "correct" it: pressing enter on a recalled destructive command is
# exactly the accident this avoids.
enter_accept = false

[daemon]
enabled = false
autostart = false

[ai]
enabled = false

# --- Keeping secrets out of history ------------------------------------------
#
# secrets_filter is ON by default and needs no entry here, but its coverage is
# narrow: AWS key IDs, GitHub PATs (old and new), Slack OAuth tokens, Slack
# webhooks and Stripe live/test keys. Anything else — a bearer token, a database
# URL with a password, a --token= flag — is recorded verbatim.
#
# SECURITY.md requires secrets to be passed through prompts, environment files or
# a secret manager rather than on the command line. The filters below are the
# compensating control for when one slips through anyway.
#
# They stay commented because enabling a regex silently drops matching commands
# from history, which is only safe once the pattern is chosen deliberately. Both
# are unanchored: without ^ or $ they match anywhere in the string.
#
# history_filter = [
#   "--token[= ]",
#   "--password[= ]",
#   "(?i)authorization: bearer",
# ]
#
# cwd_filter excludes commands by the directory they ran in, for a tree whose
# command lines are sensitive regardless of their content.
#
# cwd_filter = [
#   "/clients/",
# ]
#
# A leading space keeps a single command out of history without any regex:
# HIST_IGNORE_SPACE is set in .zshrc and Atuin follows the same convention.
