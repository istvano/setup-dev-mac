name: security-ai-workstation
services:
  postgres:
    image: ${PGVECTOR_IMAGE:?Run wsctl pin-images first}
    profiles: ["data"]
    environment:
      POSTGRES_DB: workstation
      POSTGRES_USER: workstation
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    secrets: ["postgres_password"]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
  redis:
    image: ${REDIS_IMAGE:?Run wsctl pin-images first}
    profiles: ["data"]
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis-data:/data"]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
  qdrant:
    image: ${QDRANT_IMAGE:?Run wsctl pin-images first}
    profiles: ["ai"]
    ports: ["127.0.0.1:6333:6333", "127.0.0.1:6334:6334"]
    volumes: ["qdrant-data:/qdrant/storage"]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
  mlflow:
    image: ${MLFLOW_IMAGE:?Run wsctl pin-images first}
    profiles: ["ai"]
    command: ["mlflow", "server", "--host", "0.0.0.0", "--port", "5000", "--backend-store-uri", "sqlite:////mlflow/mlflow.db", "--default-artifact-root", "/mlflow/artifacts"]
    ports: ["127.0.0.1:5000:5000"]
    volumes: ["mlflow-data:/mlflow"]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
secrets:
  postgres_password:
    file: ./secrets/postgres_password
volumes:
  postgres-data:
  redis-data:
  qdrant-data:
  mlflow-data:
