name: validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  linux-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck python3-yaml
      - run: find . -type f \( -name '*.sh' -o -name bootstrap \) -print0 | xargs -0 shellcheck -x
      - run: ./script/test
  macos-render:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./tests/render-brewfile.sh
      - run: ./bootstrap plan
