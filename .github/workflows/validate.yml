name: validate
on: [push, pull_request]
permissions:
  contents: read
env:
  # A missing linter must fail the job rather than silently skip its check.
  REQUIRE_LINTERS: "1"
  REQUIRE_CHEZMOI: "1"
jobs:
  linux-static:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs so CI honours the immutable-reference
      # rule this repository already applies to container images (ADR-006).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck python3-yaml
          # shfmt, actionlint, gitleaks and chezmoi are not available in a
          # current-enough form from apt.
          go install mvdan.cc/sh/v3/cmd/shfmt@latest
          go install github.com/rhysd/actionlint/cmd/actionlint@latest
          go install github.com/zricethezav/gitleaks/v8@latest
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"
          echo "$HOME/go/bin" >>"$GITHUB_PATH"
          echo "$HOME/.local/bin" >>"$GITHUB_PATH"
      # script/test discovers shell scripts by shebang via script/shell-files,
      # so the previously skipped extensionless scripts under script/ are now
      # linted. CI no longer maintains its own duplicate file selector.
      - run: ./script/test

  macos-render:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: brew install shellcheck shfmt actionlint gitleaks yamllint chezmoi
      - run: ./script/test
      - run: ./bootstrap plan
