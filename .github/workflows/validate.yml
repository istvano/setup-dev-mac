name: validate
on: [push, pull_request]
permissions:
  contents: read
env:
  # A missing linter must fail the job rather than silently skip its check.
  REQUIRE_LINTERS: "1"
  REQUIRE_CHEZMOI: "1"
jobs:
  linux-static:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs so CI honours the immutable-reference
      # rule this repository already applies to container images (ADR-006).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck python3-yaml
          # shfmt, actionlint, gitleaks and chezmoi are not available in a
          # current-enough form from apt.
          #
          # PINNED, for the reason ADR-006 pins image tags and
          # tests/mcp-policy.sh refuses @latest in an MCP package spec. These four
          # decide whether a change is allowed to merge, so a floating version
          # here is a wider exposure than a floating version anywhere the rule was
          # already enforced. tests/placement-policy.sh now asserts they stay
          # pinned, and script/update-report reports when they fall behind.
          #
          # `go install` resolves the exact version and verifies it against the Go
          # checksum database, so pinning buys integrity and not only
          # reproducibility.
          #
          # chezmoi comes from the same mechanism rather than
          # `sh -c "$(curl … get.chezmoi.io)"`, which was unreviewed remote-script
          # execution of exactly the kind AGENTS.md forbids and ADR-042 rejected
          # SDKMAN over. A go-install build cannot self-upgrade and reports its
          # version as "dev"; nothing here needs either.
          #
          # gitleaks keeps the github.com/zricethezav path. The GitHub repository
          # moved to github.com/gitleaks/gitleaks, and an earlier version of this
          # file "corrected" the import to match — which does not build. A Go
          # module's identity is the path its own go.mod DECLARES, and v8.30.1
          # still declares `module github.com/zricethezav/gitleaks/v8`. The proxy
          # answers metadata for both spellings, so the mistake survived a check
          # that only resolved the version; `go install` validates the declared
          # path and refused it. Follow the go.mod, not the browser URL.
          go install mvdan.cc/sh/v3/cmd/shfmt@v3.13.1
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          echo "$HOME/go/bin" >>"$GITHUB_PATH"

          # chezmoi cannot be `go install`ed at all: its go.mod carries a replace
          # directive, and `go install pkg@version` refuses any module that does,
          # because the replacement would make the build differ from a normal one.
          # So it comes as its released binary, pinned by version AND verified
          # against the digest published in the release's own checksums file.
          #
          # That is the pattern script/install-toolhive and script/install-tart
          # already use for the same problem, and it is a stronger guarantee than
          # the `sh -c "$(curl ...)"` this replaced: that fetched whatever the web
          # server served, unpinned and unverified.
          CHEZMOI_VERSION=2.72.0
          CHEZMOI_SHA256=0d6665b96c527d57fdc562bf19e808f80f48c2d977062c03e3e65c6b09eafbce
          curl -fsSL -o /tmp/chezmoi.tar.gz \
            "https://github.com/twpayne/chezmoi/releases/download/v${CHEZMOI_VERSION}/chezmoi_${CHEZMOI_VERSION}_linux_amd64.tar.gz"
          echo "${CHEZMOI_SHA256}  /tmp/chezmoi.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf /tmp/chezmoi.tar.gz -C "$HOME/.local/bin" chezmoi
          echo "$HOME/.local/bin" >>"$GITHUB_PATH"
      # script/test discovers shell scripts by shebang via script/shell-files,
      # so the previously skipped extensionless scripts under script/ are now
      # linted. CI no longer maintains its own duplicate file selector.
      - run: ./script/test

  macos-render:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: brew install shellcheck shfmt actionlint gitleaks yamllint chezmoi
      - run: ./script/test
      - run: ./bootstrap plan
